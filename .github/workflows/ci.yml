name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libdbus-1-3 libfontconfig1
      - name: Install
        # PySide6 6.12.0 crashed on Linux + Python 3.11 in the XAFSmith project (none_dealloc); pin until upstream fixes it.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" ruff
          python -c "import sys; print(sys.version)"
      - name: Limit PySide6 on Linux + Python 3.11
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: pip install "PySide6<6.12"
      - name: Ruff
        run: ruff check src tests
      - name: Tests (offscreen; PYTHONUTF8 deliberately NOT set)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
